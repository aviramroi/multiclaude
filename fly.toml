app = "multiclaude"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4747"
  MULTICLAUDE_DB = "/data/multiclaude.db"
  PUBLIC_URL = "https://multiclaude.fly.dev"

[[mounts]]
  source = "multiclaude_data"
  destination = "/data"

[http_service]
  internal_port = 4747
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"
